services:
  postgres:
    container_name: expense-tracker-test-postgres
    volumes:
      - construction_khr_data:/var/lib/postgresql/data
  backend:
    container_name: expense-tracker-test-backend
    environment:
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      TELEGRAM_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_BOT_USERNAME: ""
      TELEGRAM_WEBHOOK_SECRET: ""
  frontend:
    container_name: expense-tracker-test-frontend

volumes:
  construction_khr_data:
