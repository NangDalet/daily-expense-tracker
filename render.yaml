services:
  - type: web
    name: daily-expense-tracker-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: R2_ENABLED
        value: "true"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: SERVER_PORT
        value: 10000
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=60.0
      - key: DB_POOL_MAX_SIZE
        value: 5
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TELEGRAM_ENABLED
        value: "true"
      - key: TELEGRAM_MINI_APP_ENABLED
        value: "true"
      - key: TELEGRAM_UPDATES_MODE
        value: webhook
      - key: TELEGRAM_BOT_USERNAME
        value: MSGPortfolioBot
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
