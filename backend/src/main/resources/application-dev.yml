# ==============================================================================
# dev profile - local development on localhost
# ==============================================================================
spring:
  config:
    # Private settings work when launched from the backend or repository directory.
    import: "optional:file:./.env.telegram[.properties],optional:file:./backend/.env.telegram[.properties]"

mybatis:
  configuration:
    # Pretty-print SQL + bind parameters so dynamic <if>/<foreach> output is visible
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.example.expensetracker: DEBUG
    com.example.expensetracker.mapper: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: INFO

app:
  security:
    jwt:
      # Leave empty in dev to use locally issued tokens (/api/v1/auth/login)
      issuer-uri: ${OAUTH_ISSUER_URI:}
